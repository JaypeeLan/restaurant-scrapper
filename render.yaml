# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. Web API (Free)   → uvicorn + built dashboard at /
#   2. Ingest cron      → every 30 min (Starter, billed while running)
#   3. Discover cron    → daily 03:15 UTC (Starter, billed while running)
#
# Environment group `ig-ingest-env` holds Mongo / cookies / DeepSeek secrets.
# Keep INGEST_EVERY_MINUTES / DISCOVER_EVERY_HOURS in sync with the cron
# schedules below so the Runs UI matches reality.

services:
  - type: web
    name: ig-ingest-api
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    buildCommand: bash scripts/build_api.sh
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: ig-ingest-env

  - type: cron
    name: ig-ingest-cron
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    schedule: "*/30 * * * *"
    buildCommand: bash scripts/build_cron.sh
    startCommand: python main.py ingest
    envVars:
      - fromGroup: ig-ingest-env

  - type: cron
    name: ig-discover-cron
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    schedule: "15 3 * * *"
    buildCommand: bash scripts/build_discover.sh
    startCommand: python main.py discover --backend osm
    envVars:
      - fromGroup: ig-ingest-env

envVarGroups:
  - name: ig-ingest-env
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: IG_FALLBACK_ENABLED
        value: "true"
      - key: IG_GRAPH_ACCESS_TOKEN
        sync: false
      - key: IG_GRAPH_USER_ID
        sync: false
      - key: IG_COOKIES_NETSCAPE
        sync: false
      - key: IG_COOKIES_FILE
        value: cookies.txt
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_ENABLED
        value: "true"
      - key: DISCOVER_CITY
        value: lagos
      - key: INGEST_EVERY_MINUTES
        value: "30"
      - key: INGEST_LIMIT
        value: "40"
      - key: DISCOVER_EVERY_HOURS
        value: "24"
      - key: LOG_LEVEL
        value: INFO
      - key: IG_FALLBACK_MAX_PER_RUN
        value: "40"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: ms-playwright
