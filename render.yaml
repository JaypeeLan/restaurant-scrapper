# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. Web API          → uvicorn serve:app
#   2. Ingest cron      → every 30 min
#   3. Discover cron    → daily 03:15 UTC
#
# Create an Environment Group in the dashboard named `ig-ingest-env` (or change
# fromGroup below) and put secrets there once for all three services.
# Keep INGEST_EVERY_MINUTES / DISCOVER_EVERY_HOURS in sync with the cron
# schedules below so the Runs UI matches reality.

services:
  - type: web
    name: ig-ingest-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: ig-ingest-env

  - type: cron
    name: ig-ingest-cron
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py ingest
    envVars:
      - fromGroup: ig-ingest-env

  - type: cron
    name: ig-discover-cron
    runtime: python
    plan: starter
    region: oregon
    schedule: "15 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py discover --backend osm
    envVars:
      - fromGroup: ig-ingest-env
