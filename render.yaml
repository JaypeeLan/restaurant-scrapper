# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. Web API (Free)   → uvicorn + built dashboard at /
#   2. Ingest cron      → every 30 min (Starter, billed while running)
#   3. Discover cron    → every 4h + ingest after seed (Starter)
#   4. Menu cron        → weekly Sundays 03:30 UTC (Starter)
#   5. Keepalive cron   → every 10 min
#
# Environment group `ig-ingest-env` holds Mongo / cookies / DeepSeek secrets.
# Keep INGEST_EVERY_MINUTES / DISCOVER_EVERY_HOURS / MENU_CRON in sync with
# the cron schedules below so the Runs UI matches reality.

services:
  - type: web
    name: ig-ingest-api
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    buildCommand: bash scripts/build_api.sh
    startCommand: uvicorn serve:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: ig-ingest-env

  - type: cron
    name: ig-ingest-cron
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    schedule: "*/30 * * * *"
    buildCommand: bash scripts/build_cron.sh
    startCommand: python main.py ingest
    envVars:
      - fromGroup: ig-ingest-env

  - type: cron
    name: ig-discover-cron
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    # :15 past 00/04/08/12/16/20 UTC — then ingest so new seeds are fetched now.
    schedule: "15 */4 * * *"
    buildCommand: bash scripts/build_cron.sh
    startCommand: python main.py discover --backend osm --ingest-after
    envVars:
      - fromGroup: ig-ingest-env

  # Menus change rarely. Re-OCR / re-structure highlight trays weekly.
  # Needs IG cookies + (ideally) tesseract; without tesseract OCR is empty.
  - type: cron
    name: ig-menu-cron
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    schedule: "30 3 * * 0"
    buildCommand: bash scripts/build_cron.sh
    startCommand: python main.py backfill-menus --limit 40
    envVars:
      - fromGroup: ig-ingest-env

  # Free web sleeps after ~15m idle. Ping keeps the API awake so the Vercel
  # dashboard does not hit the Render “APPLICATION LOADING” interstitial.
  - type: cron
    name: ig-keepalive-cron
    runtime: python
    plan: starter
    region: oregon
    repo: https://github.com/JaypeeLan/restaurant-scrapper
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: bash scripts/build_keepalive.sh
    startCommand: bash scripts/keepalive.sh
    envVars:
      - fromGroup: ig-ingest-env
      - key: KEEPALIVE_URL
        value: https://ig-ingest-api.onrender.com/api/health

envVarGroups:
  - name: ig-ingest-env
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: IG_FALLBACK_ENABLED
        value: "true"
      - key: IG_GRAPH_ACCESS_TOKEN
        sync: false
      - key: IG_GRAPH_USER_ID
        sync: false
      - key: IG_COOKIES_NETSCAPE
        sync: false
      - key: IG_COOKIES_FILE
        value: cookies.txt
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_ENABLED
        value: "true"
      - key: DISCOVER_CITY
        value: lagos
      - key: INGEST_EVERY_MINUTES
        value: "30"
      - key: INGEST_LIMIT
        value: "40"
      - key: DISCOVER_EVERY_HOURS
        value: "4"
      - key: DISCOVER_CRON_MINUTE
        value: "15"
      - key: MENU_EVERY_DAYS
        value: "7"
      - key: MENU_BACKFILL_LIMIT
        value: "40"
      - key: MENU_CRON
        value: "30 3 * * 0"
      - key: LLM_BACKFILL_LIMIT
        value: "25"
      - key: LOG_LEVEL
        value: INFO
      - key: IG_FALLBACK_MAX_PER_RUN
        value: "40"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: ms-playwright
